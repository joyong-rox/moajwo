name: moajwo

services:
  backend:
    build: ./backend
    environment:
      MOAJWO_DATA_DIR: /app/data
    volumes:
      - moajwo-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  moajwo-data:
