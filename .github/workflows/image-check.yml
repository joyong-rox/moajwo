# 진단 전용: 배포 이미지와 외부 DB(PostgreSQL) 동작을 격리 러너(GitHub 호스트, 공개 저장소라 무료)에서 확인한다.
# 대상 커밋 위에 이 파일만 얹은 'ci/image-check-*' 브랜치를 올릴 때만 돈다 — main·PR에는 영향이 없다.
# 운영·Render·Neon 서비스로 요청하지 않는다. 결과는 아티팩트(30일)로 남긴다.
name: image-check (diagnostic)

on:
  push:
    branches: ["ci/image-check-**"]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build, run and scan the images
        run: bash diagnostics/ci/image_check.sh out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-check
          path: out
          retention-days: 30

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          # 이 러너 안의 일회용 시험 서버 값 (밖에서 닿지 않음, 실행이 끝나면 사라짐)
          POSTGRES_PASSWORD: ci-throwaway-pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_ADMIN: postgresql://postgres:ci-throwaway-pg@127.0.0.1:5432/postgres
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: install (requirements.txt is resolved for Python 3.11 / linux)
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip check
          mkdir -p out
          python -m pip freeze > out/pip-freeze.txt
      - name: backend tests on SQLite
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider 2>&1 | tee ../out/pytest-sqlite.txt; exit ${PIPESTATUS[0]}
      - name: backend tests on PostgreSQL 17
        working-directory: backend
        run: |
          python -c "import os; from sqlalchemy import create_engine, text; e = create_engine(os.environ['PG_ADMIN'].replace('postgresql://', 'postgresql+psycopg://'), isolation_level='AUTOCOMMIT'); e.connect().execute(text('CREATE DATABASE ci_tests'))"
          MOAJWO_TEST_DATABASE_URL="${PG_ADMIN%/postgres}/ci_tests" python -m pytest -q -rs -p no:cacheprovider 2>&1 | tee ../out/pytest-postgres.txt; exit ${PIPESTATUS[0]}
      - name: account preservation check (real processes)
        if: always()
        run: python diagnostics/scripts/external_db_check.py --admin-url "$PG_ADMIN" --backend backend --out out/extdb --pg-docker postgres:17
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: postgres-check
          path: out
          retention-days: 30
