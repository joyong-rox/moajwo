# B′ — 구판(0022 이전 이미지)으로 되돌린 동안 공개 회원가입을 막는 덧붙임 설정 (docs/DEPLOY.md 4장 B′ · docs/RECOVERY_RUNBOOK.md).
# 구판 이미지는 고치지 않는다. 롤백 B의 덧붙임(-f docker-compose.yml -f backups/rollback-<시각>.compose.yml) **뒤에** 한 번 더 -f로 붙인다:
#   BPRIME_CONF=<호스트 절대 경로>  docker compose -f docker-compose.yml -f backups/rollback-<시각>.compose.yml -f deploy/bprime/compose.bprime.yml up -d --no-build --wait
# - frontend: 그 구판 이미지 자신의 nginx 설정(/etc/nginx/conf.d/default.conf)에 deploy/bprime/signup-410.location 블록을 끼운 파일(BPRIME_CONF,
#   P1 상자가 backups/bprime-<시각>.conf 로 만든다)을 읽기 전용으로 덮어 씌운다 → POST /api/auth/signup 은 nginx가 410(JSON detail)으로 끝내고 backend에
#   닿지 않는다. 다른 경로·보안 헤더는 그 이미지의 설정 그대로다.
# - backend: 호스트 포트 공개를 없앤다(ports: !override []) — 127.0.0.1:8000 으로 프록시를 우회해 /auth/signup 에 닿는 길을 막는다. 컨테이너끼리의
#   backend:8000 은 그대로라 frontend 프록시·health는 정상이다. (이 때문에 backend 컨테이너가 다시 만들어진다 — 세션은 DB에 있어 유지)
# - 해제(P0 상자): 이 파일 없이 같은 up 명령 → 설정이 롤백 단위 그대로로 돌아간다 (가입 허용·backend 포트 공개). DB·자료는 건드리지 않는다.
services:
  frontend:
    volumes:
      - "${BPRIME_CONF:?B′ nginx 설정 파일 경로(BPRIME_CONF)가 필요합니다 — P1 상자가 만듭니다}:/etc/nginx/conf.d/default.conf:ro"
  backend:
    ports: !override []
