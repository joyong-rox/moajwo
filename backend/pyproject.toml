[project]
name = "moajwo-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.isort]
# 로컬 alembic/ 디렉터리 때문에 alembic 패키지가 first-party로 오인되는 것을 막는다.
known-third-party = ["alembic"]
known-first-party = ["app"]
