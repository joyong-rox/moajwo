# 접근 기록에는 쿼리 값을 남기지 않는다 — 이름 검색어 등이 기록에 남지 않게 (backend 접근 기록과 같은 기준).
# 요청한 경로는 그대로 남기고($request_uri에서 '?' 앞까지), 출처(referer)·브라우저 정보는 남기지 않는다.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}
log_format moajwo '$remote_addr - [$time_local] "$request_method $request_path $server_protocol" $status $body_bytes_sent $request_time';

server {
    # 비루트 실행이라 1024 아래 포트를 쓰지 않는다 (호스트 공개 주소는 compose·Render 설정이 정함)
    listen 8080;
    access_log /var/log/nginx/access.log moajwo;
    server_name _;
    # 보안 응답 헤더 (S-03). 화면은 같은 출처의 파일만 쓴다 — 외부 글꼴·스크립트·인라인 스크립트 없음.
    # add_header가 있는 location은 위 헤더를 물려받지 않으므로 아래 두 location에 같은 줄을 다시 적는다.
    # style-src의 해시 두 개는 react-aria가 실행 중에 <head>에 넣는 인라인 <style> 두 개의 내용 해시다 — usePress의 touch-action 규칙(첫 pressable
    # 마운트 때 한 번)과 usePreventScroll의 iOS용 overscroll-behavior 규칙. nonce가 없으면 'self'만으로는 막혀 콘솔 경고가 났다(2026-10-30 확인).
    # 그 두 내용만 허용하며 unsafe-inline이 아니다. frontend/scripts/check-csp-style-hashes.mjs가 빌드 앞(prebuild)에서 라이브러리 내용과 대조한다.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-38RhXrc7EdReTKsOm23ZPOCUgniTUUcjky8QOOrQx6o=' 'sha256-gYiS/BvZvRcK27JIXTuwhZ3hs2+VJ1X+2gUlE+farlg='; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    # 문서 업로드 대비 (기본 1MB 제한 해제)
    client_max_body_size 100m;

    # /api/* -> backend:8000/* (접두어 제거)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 해시된 정적 자산은 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-38RhXrc7EdReTKsOm23ZPOCUgniTUUcjky8QOOrQx6o=' 'sha256-gYiS/BvZvRcK27JIXTuwhZ3hs2+VJ1X+2gUlE+farlg='; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # SPA: 직접 URL 접근/새로고침 시 index.html 반환
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-38RhXrc7EdReTKsOm23ZPOCUgniTUUcjky8QOOrQx6o=' 'sha256-gYiS/BvZvRcK27JIXTuwhZ3hs2+VJ1X+2gUlE+farlg='; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
