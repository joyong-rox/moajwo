# 접근 기록에는 쿼리 값을 남기지 않는다 — 이름 검색어 등이 기록에 남지 않게 (backend 접근 기록과 같은 기준).
# 요청한 경로는 그대로 남기고($request_uri에서 '?' 앞까지), 출처(referer)·브라우저 정보는 남기지 않는다.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}
log_format moajwo '$remote_addr - [$time_local] "$request_method $request_path $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log moajwo;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 문서 업로드 대비 (기본 1MB 제한 해제)
    client_max_body_size 100m;

    # /api/* -> backend:8000/* (접두어 제거)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 해시된 정적 자산은 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: 직접 URL 접근/새로고침 시 index.html 반환
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
