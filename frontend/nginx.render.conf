# 접근 기록에는 쿼리 값을 남기지 않는다 — 이름 검색어 등이 기록에 남지 않게 (backend 접근 기록과 같은 기준).
# 요청한 경로는 그대로 남기고($request_uri에서 '?' 앞까지), 출처(referer)·브라우저 정보는 남기지 않는다.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}
log_format moajwo '$remote_addr - [$time_local] "$request_method $request_path $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log moajwo;
    server_name _;
    # 보안 응답 헤더 (S-03). 화면은 같은 출처의 파일만 쓴다 — 외부 글꼴·스크립트·인라인 스크립트 없음.
    # add_header가 있는 location은 위 헤더를 물려받지 않으므로 아래 두 location에 같은 줄을 다시 적는다.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # Render test API. Keep the trailing slash to strip the /api/ prefix.
    location /api/ {
        proxy_pass https://moajwo-test-api.onrender.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host moajwo-test-api.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
