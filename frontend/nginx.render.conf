# 접근 기록에는 쿼리 값을 남기지 않는다 — 이름 검색어 등이 기록에 남지 않게 (backend 접근 기록과 같은 기준).
# 요청한 경로는 그대로 남기고($request_uri에서 '?' 앞까지), 출처(referer)·브라우저 정보는 남기지 않는다.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}
log_format moajwo '$remote_addr - [$time_local] "$request_method $request_path $server_protocol" $status $body_bytes_sent $request_time';

server {
    # 비루트 실행이라 1024 아래 포트를 쓰지 않는다 (호스트 공개 주소는 compose·Render 설정이 정함)
    listen 8080;
    access_log /var/log/nginx/access.log moajwo;
    server_name _;
    # 보안 응답 헤더 (S-03). 화면은 같은 출처의 파일만 쓴다 — 외부 글꼴·스크립트·인라인 스크립트 없음.
    # add_header가 있는 location은 위 헤더를 물려받지 않으므로 아래 두 location에 같은 줄을 다시 적는다.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # Render test API. Keep the trailing slash to strip the /api/ prefix.
    location /api/ {
        proxy_pass https://moajwo-test-api.onrender.com/;
        # 상류(API) 인증서를 검증한다 (2026-10 eMudhra 인증서 사고 대응 — docs/SECURITY-CA-20261026.md).
        # proxy_ssl_server_name은 SNI를 보낼 뿐 검증을 켜지 않으므로(nginx 기본값 off) proxy_ssl_verify를 따로 켠다.
        # 신뢰 묶음은 이미지의 OS CA(Alpine ca-certificates-bundle — 빌드 때 최신으로 올림)이고, 검증할 이름은 proxy_pass 호스트와
        # 같다. 깊이 3은 '뿌리 → 중간 최대 2 → 서버' 체인까지 받는 값으로, 시험한 체인(diagnostics/ci/image_check.sh: 뿌리 → 중간 →
        # 서버)과 공개 CA의 보통 체인에 맞췄다. 검증에 실패하면 요청을 전달하지 않고 502로 끝낸다 — 검증을 끄거나 http로
        # 돌아가는 우회는 두지 않는다.
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name moajwo-test-api.onrender.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host moajwo-test-api.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
