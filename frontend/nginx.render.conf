server {
    # 비루트 실행이라 1024 아래 포트를 쓰지 않는다 (호스트 공개 주소는 compose·Render 설정이 정함)
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # Render test API. Keep the trailing slash to strip the /api/ prefix.
    location /api/ {
        proxy_pass https://moajwo-test-api.onrender.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host moajwo-test-api.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
